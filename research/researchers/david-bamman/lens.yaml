interpretive_warnings:
  - Do not collapse Bamman's work into generic NLP; the official profile foregrounds underserved domains such as literature and cultural material.
  - Distinguish method-building for cultural domains from domain claims about literature, film, music, or social media.
  - Treat datasets and annotations as central research objects, not merely infrastructure.
  - Do not infer current positions from publication titles alone; verify claims against primary texts once a local corpus exists.
required_counter_lenses:
  - annotation and dataset validity
  - domain adaptation and underserved-domain performance
  - cultural representation and measurement
  - model interpretability
  - corpus construction and selection effects
