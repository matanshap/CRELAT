interpretive_warnings:
  - Do not reduce the early work to a pre-computational phase; media, embodiment, and material form remain relevant.
  - Do not equate computational reading with the rejection of interpretation or close reading.
  - Distinguish arguments about evidence and generalization from endorsement of any particular model.
  - Treat recent narrative-AI work as a development, not a timeless summary of the entire career.
required_counter_lenses:
  - sampling and corpus construction
  - historical specificity
  - construct validity
  - model and annotation bias
