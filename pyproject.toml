[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crelat"
version = "0.2.0"
description = "Reproducible computational analysis of character relationships in literature"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<23",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
transformers = [
  "huggingface-hub>=0.25,<1",
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
]
research = [
  "pypdf>=6,<7",
  "sentence-transformers>=3,<6",
]
dev = [
  "coverage>=7,<8",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["crelat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
